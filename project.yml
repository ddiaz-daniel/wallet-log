name: WalletLog
options:
  bundleIdPrefix: com.dalen
  deploymentTarget:
    iOS: "17.0"
targets:
  WalletLog:
    type: application
    platform: iOS
    sources:
      - WalletLog
    info:
      path: WalletLog/Generated-Info.plist
      properties:
        CFBundleDisplayName: WalletLog
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocationWhenInUseUsageDescription: "WalletLog saves where each payment happened."
        NSLocationAlwaysAndWhenInUseUsageDescription: "WalletLog saves where each payment happened, even when a payment is logged in the background by Shortcuts."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dalen.walletlog
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
  WalletLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WalletLogTests
    settings:
      base:
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WalletLog.app/WalletLog"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: WalletLog
schemes:
  WalletLog:
    build:
      targets:
        WalletLog: all
        WalletLogTests: [test]
    test:
      targets:
        - WalletLogTests
